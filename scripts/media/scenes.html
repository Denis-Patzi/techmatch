<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TechMatch · Escenas para video</title>
    <style>
      html,
      body {
        margin: 0;
        background: #081426;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js",
          "three/addons/": "/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const variant = new URLSearchParams(location.search).get('scene') || 'hardware';
      const portrait = new URLSearchParams(location.search).get('format') === 'portrait';
      const width = portrait ? 540 : 960;
      const height = portrait ? 960 : 600;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#081426');
      scene.fog = new THREE.Fog('#081426', 16, 35);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
      const model = new THREE.Group();
      scene.add(model);
      const fans = [];
      const pulses = [];
      let processor, scan;

      const material = (color, metalness = 0.4, roughness = 0.3) =>
        new THREE.MeshStandardMaterial({ color, metalness, roughness });
      const graphite = material('#243348', 0.75, 0.28);
      const dark = material('#0e1929', 0.35, 0.38);
      const silver = material('#b9d4e9', 0.85, 0.22);
      const board = material('#103047', 0.4, 0.42);
      const blue = new THREE.MeshStandardMaterial({
        color: '#1c75e8',
        emissive: '#075dd1',
        emissiveIntensity: 0.6,
        roughness: 0.3,
        toneMapped: false,
      });
      const ice = new THREE.MeshStandardMaterial({
        color: '#b6e5ff',
        emissive: '#3c99ff',
        emissiveIntensity: 1.3,
      });
      const gold = material('#bd9f5c', 0.85, 0.3);

      function box(parent, w, h, d, x, y, z, mat, radius = 0.035) {
        const mesh = new THREE.Mesh(
          new RoundedBoxGeometry(w, h, d, 2, Math.min(radius, w / 3, h / 3, d / 3)),
          mat
        );
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }
      function cylinder(parent, radius, depth, x, y, z, mat, front = false) {
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, 48), mat);
        mesh.position.set(x, y, z);
        if (front) mesh.rotation.x = Math.PI / 2;
        mesh.castShadow = true;
        parent.add(mesh);
        return mesh;
      }
      function ring(parent, radius, tube, x, y, z, mat, flat = false) {
        const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, 96), mat);
        mesh.position.set(x, y, z);
        if (flat) mesh.rotation.x = -Math.PI / 2;
        parent.add(mesh);
        return mesh;
      }
      function path(points, color = '#3376ab', opacity = 0.55) {
        const geometry = new THREE.BufferGeometry().setFromPoints(
          points.map((p) => new THREE.Vector3(...p))
        );
        const line = new THREE.Line(
          geometry,
          new THREE.LineBasicMaterial({ color, transparent: true, opacity })
        );
        model.add(line);
        return line;
      }

      scene.add(new THREE.HemisphereLight('#bcdfff', '#16283f', 2));
      const key = new THREE.DirectionalLight('#e5f3ff', 4);
      key.position.set(-3, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.left = -9;
      key.shadow.camera.right = 9;
      key.shadow.camera.top = 9;
      key.shadow.camera.bottom = -9;
      key.shadow.normalBias = 0.04;
      scene.add(key);
      const rim = new THREE.DirectionalLight('#267aff', 5);
      rim.position.set(4, 3, -4);
      scene.add(rim);
      const floorMaterial = new THREE.MeshPhongMaterial({
        color: '#061326',
        specular: '#061326',
        shininess: 18,
      });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = portrait ? -3.5 : -2;
      floor.receiveShadow = true;
      scene.add(floor);
      const stageRing = ring(scene, 4.2, 0.012, 0, floor.position.y + 0.015, 0, blue, true);
      ring(scene, 4.8, 0.006, 0, floor.position.y + 0.02, 0, material('#244869'), true);

      if (variant === 'hardware') {
        camera.position.set(...(portrait ? [3, 1.8, 12.8] : [5, 2.8, 9.8]));
        camera.zoom = portrait ? 1 : 1.2;
        camera.updateProjectionMatrix();
        camera.lookAt(0, portrait ? -0.5 : 0, 0);
        box(model, 6, 2.2, 0.7, 0, 0, 0, graphite, 0.16);
        box(model, 5.8, 2.05, 0.12, 0, 0, -0.43, board);
        box(model, 5.65, 0.55, 0.6, 0, -0.84, 0, silver);
        for (let i = 0; i < 37; i++)
          box(model, 0.045, 1.8, 0.65, -2.72 + i * 0.151, 0, -0.13, silver, 0.01);
        box(model, 5.96, 2.16, 0.15, 0, 0, 0.4, dark, 0.15);
        box(model, 5.9, 0.065, 0.08, 0, 1.02, 0.5, blue, 0.02);
        box(model, 2.8, 0.17, 0.065, -0.35, -1.2, -0.2, gold, 0.01);
        for (let i = 0; i < 30; i++)
          box(model, 0.019, 0.14, 0.01, -1.69 + i * 0.094, -1.2, -0.159, dark, 0.003);
        box(model, 0.12, 2.45, 0.85, -3.04, 0, -0.03, silver);
        for (const y of [-0.68, 0, 0.68]) box(model, 0.14, 0.35, 0.43, -3.11, y, 0.0, dark);
        for (const x of [-1.91, 0, 1.91]) {
          cylinder(model, 0.86, 0.1, x, 0, 0.51, graphite, true);
          cylinder(model, 0.77, 0.1, x, 0, 0.58, dark, true);
          ring(model, 0.85, 0.025, x, 0, 0.59, silver);
          ring(model, 0.79, 0.012, x, 0, 0.64, blue);
          const fan = new THREE.Group();
          fan.position.set(x, 0, 0.65);
          model.add(fan);
          fans.push(fan);
          for (let n = 0; n < 11; n++) {
            const arm = new THREE.Group();
            arm.rotation.z = (n * Math.PI * 2) / 11;
            fan.add(arm);
            const blade = box(arm, 0.26, 0.55, 0.04, 0.1, 0.46, 0, graphite, 0.04);
            blade.rotation.z = -0.45;
          }
          cylinder(model, 0.23, 0.09, x, 0, 0.73, silver, true);
          ring(model, 0.12, 0.014, x, 0, 0.79, ice);
        }
        for (const x of [-2.8, 2.8])
          for (const y of [-0.88, 0.88]) cylinder(model, 0.04, 0.025, x, y, 0.51, silver, true);
        model.rotation.z = portrait ? 1.2 : 0.08;
      } else {
        camera.position.set(6.8, 6.7, 8.2);
        camera.lookAt(0, 0.05, 0);
        box(model, 5.7, 0.15, 4.5, 0, -0.6, 0, board, 0.14);
        box(model, 2.25, 0.18, 2.25, 0, -0.44, 0, graphite);
        box(model, 1.82, 0.1, 1.82, 0, -0.29, 0, dark);
        processor = new THREE.Group();
        model.add(processor);
        box(processor, 1.9, 0.12, 1.9, 0, 0, 0, board);
        box(processor, 1.62, 0.2, 1.62, 0, 0.14, 0, silver, 0.09);
        box(processor, 0.72, 0.012, 0.72, 0, 0.246, 0, graphite, 0.06);
        box(processor, 0.42, 0.015, 0.42, 0, 0.26, 0, blue, 0.03);
        for (let i = 0; i < 12; i++)
          for (const s of [-1, 1]) {
            const p = -0.82 + i * 0.149;
            box(processor, 0.06, 0.1, 0.06, p, -0.1, s * 0.83, gold, 0.01);
            box(processor, 0.06, 0.1, 0.06, s * 0.83, -0.1, p, gold, 0.01);
          }
        for (let i = 0; i < 8; i++)
          for (const s of [-1, 1]) {
            const z = -0.85 + i * 0.24;
            const points = [
              [s * 1.13, -0.508, z],
              [s * 1.38, -0.508, z],
              [s * 1.7, -0.508, z + 0.3],
              [s * 2.56, -0.508, z + 0.3],
            ];
            path(points);
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), ice);
            model.add(dot);
            pulses.push({ dot, points });
          }
        for (const x of [-2.16, 2.16])
          for (const z of [-1.65, 1.65]) {
            box(model, 0.78, 0.24, 0.44, x, -0.43, z, dark);
            for (let i = 0; i < 5; i++)
              box(model, 0.08, 0.035, 0.51, x - 0.29 + i * 0.145, -0.46, z, silver, 0.01);
          }
        for (let i = 0; i < 15; i++)
          box(model, 0.065, 0.18, 1.32, 1.2 + i * 0.085, -0.39, -0.05, graphite, 0.01);
        for (const x of [-2.55, 2.55])
          for (const z of [-1.95, 1.95]) cylinder(model, 0.09, 0.03, x, -0.5, z, silver);
        const scanMaterial = new THREE.MeshBasicMaterial({
          color: '#3d99ff',
          transparent: true,
          opacity: 0.13,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        scan = new THREE.Mesh(new THREE.PlaneGeometry(4.95, 2.6), scanMaterial);
        scan.position.y = 0.25;
        scan.add(
          new THREE.LineSegments(
            new THREE.EdgesGeometry(scan.geometry),
            new THREE.LineBasicMaterial({ color: '#71bcff', transparent: true, opacity: 0.42 })
          )
        );
        model.add(scan);
        stageRing.scale.setScalar(0.84);
      }

      window.renderFrame = (time) => {
        const cycle = (time / 8) * Math.PI * 2;
        model.rotation.y = Math.sin(cycle) * 0.18 - 0.16;
        model.position.y = Math.sin(cycle) * 0.1;
        fans.forEach((fan) => {
          fan.rotation.z = -cycle * 3;
        });
        if (processor) {
          processor.position.y = 0.45 + Math.sin(cycle) * 0.13;
          scan.position.z = Math.sin(cycle) * 1.9;
          scan.material.opacity = 0.09 + 0.045 * (Math.cos(cycle) + 1);
          pulses.forEach(({ dot, points }, index) => {
            const progress = ((time / 4 + index / 16) % 1) * (points.length - 1);
            const start = Math.floor(progress),
              end = Math.min(start + 1, points.length - 1);
            dot.position
              .fromArray(points[start])
              .lerp(new THREE.Vector3(...points[end]), progress - start);
          });
        }
        renderer.render(scene, camera);
        return renderer.domElement.toDataURL('image/png').split(',')[1];
      };
      window.renderFrame(0);
      window.sceneReady = true;
    </script>
  </body>
</html>
